[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecodatasystem"          # 패키지 이름
version = "0.1.0"       # 버전
description = "data system for ecological data"  # 패키지 설명
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]